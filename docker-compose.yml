services:
  db:
    image: postgres:16-alpine
    container_name: kroni-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kroni}
      POSTGRES_USER: ${POSTGRES_USER:-kroni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kroni123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kroni} -d ${POSTGRES_DB:-kroni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API REST (Node.js + Express), organizada por módulos y capas
  backend:
    build: ./backend
    container_name: kroni-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-kroni}:${POSTGRES_PASSWORD:-kroni123}@db:5432/${POSTGRES_DB:-kroni}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Frontend Angular servido con Nginx (redirige /api al backend)
  web:
    build: ./frontend
    container_name: kroni-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
